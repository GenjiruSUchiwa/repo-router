[package]
name = "rr-git"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
gix = { version = "0.86.0", default-features = false, features = ["index", "sha1", "attributes"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
rr-core = { path = "../rr-core" }
rayon = { workspace = true }

# Safe wrappers for the descriptor-relative no-follow opens source verification
# needs; already in the tree through gix-index, so this costs no new build.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
