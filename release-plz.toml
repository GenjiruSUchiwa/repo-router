[workspace]
# Single version for the whole workspace, driven by conventional commits.
changelog_update = true
git_release_enable = false
git_tag_enable = false
publish = false
release = false

[[package]]
name = "rr-cli"
# rr-cli carries the public version: vX.Y.Z tag and GitHub Release.
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
release = true
publish = false
