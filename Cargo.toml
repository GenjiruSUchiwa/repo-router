[workspace]
resolver = "2"
members = [
    "crates/rr-core",
    "crates/rr-git",
    "crates/rr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["repo-router contributors"]
license = "MIT"
repository = "https://github.com/GenjiruSUchiwa/repo-router"

[workspace.dependencies]
blake3 = "1"
rayon = "1"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
ignore = "0.4.23"
crossbeam-channel = "0.5.14"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.17"
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
sha1 = "0.10"
sha2 = "0.10"
tree-sitter = "=0.25.10"
# Pinned: parser/query and grammar semantics are part of deterministic extraction.
# Bumping any tree-sitter, tags, or grammar pin requires a paired EXTRACTOR_VERSION bump.
tree-sitter-rust = "=0.24.2"
tree-sitter-tags = "=0.25.10"
tree-sitter-python = "=0.25.0"
tree-sitter-language = "=0.1.7"
smallvec = { version = "1.13", features = ["serde"] }
# Pinned: this crate's NFC tables are part of the lexical fingerprint. When
# bumping, also bump NORMALIZATION_CRATE_VERSION in crates/rr-core/src/lex/mod.rs
# so stale snapshots are invalidated.
unicode-normalization = "=0.1.24"
unicode-ident = "1"
insta = { version = "1", features = ["yaml"] }
criterion = "0.7"
proptest = "1.6"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
